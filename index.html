<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Atlas Histórico de Andalucía</title>
<meta name="description" content="Atlas Histórico de Andalucía: pueblos, ciudades y paisajes de Andalucía a través del tiempo.">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
  #portada { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0f1714; }
</style>
</head>
<body>
<iframe id="portada" title="Portada del atlas" src="about:blank"></iframe>
<script>
(function () {
  // Solo queda la portada F (Juan, 20-nov-2026: «quita lo de 8 temas»): sin selector visible. Las demás se siguen
  // abriendo con ?p=e, a, b, c o d para quien tenga el enlace; sus carpetas siguen en portadas/.
  var PORTADAS = { f: "En relieve" };
  var POR_DEFECTO = "f";
  var FONDOS = { c: "#fff", e: "#fff", f: "#0f3b2c" };   // color del marco mientras carga: sin parpadeo
  var frame = document.getElementById("portada");
  var p = new URLSearchParams(location.search).get("p");
  if (!PORTADAS[p]) p = POR_DEFECTO;
  frame.style.background = FONDOS[p] || "";
  frame.setAttribute("src", "portadas/" + p + "/index.html");
  document.title = p === POR_DEFECTO ? "Atlas Histórico de Andalucía" : "Atlas Histórico de Andalucía · " + PORTADAS[p];
})();
</script>
</body>
</html>
